format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time\
\n$character
"""

# コマンドラインに1行分のスペースを入れる
add_newline = true

# 左側モジュールと右寄せ情報（cmd_duration / time）の間を埋める
[fill]
symbol = '─'

# ----------------------------------------------------
# directory — 両端をキャップで閉じた独立カプセル
# ----------------------------------------------------
[directory]
style = 'bold fg:#313244 bg:#80EBDF'
truncation_length = 10
truncate_to_repo = false
truncation_symbol = "…/"
# truncation_symbol = ' ' # nf-fa-folder_open
read_only = ' 󰌾 ' # nf-md-lock
read_only_style = 'bold fg:#313244 bg:#80EBDF'
format = """
[](fg:#80EBDF)\
[ $path ]($style)\
[$read_only]($read_only_style)\
[](fg:#80EBDF)\
"""


[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[aws]
disabled = true
[gcloud]
disabled = true

# ----------------------------------------------------
# git — branch 先頭で開き / status 末尾で閉じる 1 ピル
# ----------------------------------------------------
[git_branch]
symbol = ""
style = "fg:#769ff0 bg:#1d2230"
format = """
[](fg:#1d2230)\
[$symbol $branch]($style)\
"""

[git_status]
style = "fg:#769ff0 bg:#1d2230"
format = """
[$all_status$ahead_behind]($style)\
[](fg:#1d2230)\
"""

# ----------------------------------------------------
# 右寄せ情報（$fill で本体行の右端へ）
# ----------------------------------------------------
[cmd_duration]
min_time = 1
style = 'fg:#e0af68'
format = "[ $duration]($style)"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
format = '[[  $time](fg:#a0a9cb)]($style)'

[character]
success_symbol = '[❯](bold fg:#80EBDF)'
error_symbol   = '[❯](bold fg:#f7768e)'
vimcmd_symbol  = '[V](bold green) '
